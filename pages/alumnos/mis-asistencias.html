<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mis Asistencias — Secundaria Técnica No. 87</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Montserrat', sans-serif; background: #f3f4f6; min-height: 100vh; }

    header {
      background: linear-gradient(135deg, #6b0f1a, #8b2635);
      color: white; padding: 1rem 1.5rem;
      display: flex; align-items: center; justify-content: space-between;
      box-shadow: 0 4px 20px rgba(0,0,0,.2);
      position: sticky; top: 0; z-index: 10;
    }
    .header-left { display:flex; align-items:center; gap: .75rem; }
    .logo { width:42px; height:42px; background: linear-gradient(135deg,#d4af37,#f5d060); border-radius:.6rem; display:flex; align-items:center; justify-content:center; font-weight:900; color:#6b0f1a; font-size:.9rem; flex-shrink:0; }
    header h1 { font-size:1rem; font-weight:800; }
    header p  { font-size:.7rem; opacity:.7; font-weight:500; }
    .logout-btn { background:rgba(255,255,255,.15); border:1px solid rgba(255,255,255,.2); color:white; padding:.5rem 1rem; border-radius:.6rem; font-family:'Montserrat',sans-serif; font-size:.75rem; font-weight:700; cursor:pointer; transition:all .2s; }
    .logout-btn:hover { background:rgba(255,255,255,.25); }

    .main { max-width:900px; margin:0 auto; padding:1.5rem; }

    .student-card {
      background: linear-gradient(135deg, #6b0f1a, #8b2635);
      color:white; border-radius:1rem; padding:1.5rem;
      display:flex; align-items:center; gap:1rem;
      box-shadow: 0 8px 24px rgba(107,15,26,.3);
      margin-bottom:1.5rem;
    }
    .student-avatar { width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#d4af37,#f5d060);display:flex;align-items:center;justify-content:center;font-size:1.5rem;font-weight:900;color:#6b0f1a;flex-shrink:0; }
    .student-name { font-size:1.1rem; font-weight:800; }
    .student-sub  { font-size:.75rem; opacity:.75; margin-top:.2rem; }

    .kpi-row { display:grid; grid-template-columns:repeat(3,1fr); gap:1rem; margin-bottom:1.5rem; }
    .kpi { background:white; border-radius:1rem; padding:1.25rem; text-align:center; box-shadow:0 2px 8px rgba(0,0,0,.06); border:1px solid #e5e7eb; }
    .kpi-val { font-size:2rem; font-weight:900; }
    .kpi-label { font-size:.65rem; font-weight:700; color:#6b7280; text-transform:uppercase; letter-spacing:.05em; margin-top:.2rem; }
    .kpi.green .kpi-val { color:#16a34a; }
    .kpi.red .kpi-val   { color:#dc2626; }
    .kpi.gold .kpi-val  { color:#d97706; }

    .section { background:white; border-radius:1rem; padding:1.5rem; box-shadow:0 2px 8px rgba(0,0,0,.06); border:1px solid #e5e7eb; margin-bottom:1.5rem; }
    .section h2 { font-size:.875rem; font-weight:800; color:#111827; margin-bottom:1rem; text-transform:uppercase; letter-spacing:.05em; }

    .filter-row { display:flex; gap:.75rem; margin-bottom:1rem; flex-wrap:wrap; }
    select, .filter-row input { padding:.5rem .875rem; border:2px solid #e5e7eb; border-radius:.6rem; font-family:'Montserrat',sans-serif; font-size:.8rem; font-weight:600; outline:none; transition:border-color .2s; }
    select:focus, .filter-row input:focus { border-color:#8b2635; }

    table { width:100%; border-collapse:collapse; font-size:.8rem; }
    thead th { padding:.75rem 1rem; text-align:left; font-size:.65rem; font-weight:700; color:#9ca3af; text-transform:uppercase; letter-spacing:.05em; background:#f9fafb; border-bottom:1px solid #e5e7eb; }
    tbody tr { border-bottom:1px solid #f3f4f6; transition:background .15s; }
    tbody tr:hover { background:#fafafa; }
    tbody td { padding:.75rem 1rem; color:#374151; }

    .badge {
      display:inline-flex; align-items:center; gap:.35rem;
      padding:.25rem .75rem; border-radius:999px;
      font-size:.7rem; font-weight:700;
    }
    .badge.presente { background:#dcfce7; color:#16a34a; }
    .badge.retardo  { background:#fef9c3; color:#a16207; }
    .badge.falta    { background:#fee2e2; color:#dc2626; }

    #loading { text-align:center; color:#9ca3af; font-size:.875rem; font-weight:700; padding:2rem; }
    #empty   { text-align:center; color:#9ca3af; font-size:.875rem; font-weight:600; padding:2rem; display:none; }

    @media (max-width:600px) {
      .kpi-row { grid-template-columns: repeat(3,1fr); gap:.5rem; }
      .kpi-val { font-size:1.5rem; }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <div class="logo">SEP</div>
      <div>
        <h1>Mis Asistencias</h1>
        <p>Secundaria Técnica No. 87</p>
      </div>
    </div>
    <button class="logout-btn" id="logout-btn">Cerrar Sesión</button>
  </header>

  <div class="main">
    <div class="student-card">
      <div class="student-avatar" id="student-initial">?</div>
      <div>
        <div class="student-name" id="student-name">Cargando...</div>
        <div class="student-sub" id="student-sub"></div>
      </div>
    </div>

    <div class="kpi-row">
      <div class="kpi green">
        <div class="kpi-val" id="kpi-presentes">—</div>
        <div class="kpi-label">Asistencias</div>
      </div>
      <div class="kpi red">
        <div class="kpi-val" id="kpi-faltas">—</div>
        <div class="kpi-label">Faltas</div>
      </div>
      <div class="kpi gold">
        <div class="kpi-val" id="kpi-pct">—</div>
        <div class="kpi-label">% Asistencia</div>
      </div>
    </div>

    <div class="section">
      <h2>Historial de Asistencias</h2>
      <div class="filter-row">
        <select id="filter-parcial">
          <option value="">Todos los periodos</option>
        </select>
        <select id="filter-status">
          <option value="">Todos los estados</option>
          <option value="A tiempo">Asistencia</option>
          <option value="Retardo">Retardo</option>
          <option value="Falta">Falta</option>
        </select>
      </div>
      <div id="loading">Cargando tu registro...</div>
      <div id="empty">No hay registros de asistencia aún.</div>
      <div style="overflow-x:auto">
        <table id="asist-table" style="display:none">
          <thead>
            <tr>
              <th>Fecha</th>
              <th>Estado</th>
              <th>Hora</th>
              <th>Periodo</th>
            </tr>
          </thead>
          <tbody id="asist-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script type="module">
    import { getMisAsistencias, getConfigPeriodos, getParciales } from '../../assets/js/api-client.js';

    // Verificar sesión
    const alumnoRaw = sessionStorage.getItem('alumno');
    if (!alumnoRaw) { window.location.href = 'login.html'; }
    const alumno = JSON.parse(alumnoRaw);

    // Mostrar datos del alumno
    document.getElementById('student-name').textContent = alumno.nombre_completo;
    document.getElementById('student-initial').textContent = alumno.nombre_completo.charAt(0).toUpperCase();
    document.getElementById('student-sub').textContent = `${alumno.grado || '?'}° ${alumno.grupo || ''} · Matrícula: ${alumno.matricula || '—'}`;

    document.getElementById('logout-btn').addEventListener('click', () => {
      sessionStorage.removeItem('alumno');
      window.location.href = 'login.html';
    });

    let allRecords = [];

    function statusBadge(status) {
      const map = {
        'A tiempo': '<span class="badge presente">✓ Asistencia</span>',
        'Retardo':  '<span class="badge retardo">⏱ Retardo</span>',
        'Falta':    '<span class="badge falta">✗ Falta</span>'
      };
      return map[status] || `<span class="badge">${status}</span>`;
    }

    function renderTable(records) {
      const tbody = document.getElementById('asist-tbody');
      const table = document.getElementById('asist-table');
      const empty = document.getElementById('empty');

      if (!records.length) {
        table.style.display = 'none';
        empty.style.display = 'block';
        return;
      }

      table.style.display = 'table';
      empty.style.display = 'none';

      tbody.innerHTML = records.map(r => {
        const fecha = new Date(r.date + 'T12:00:00').toLocaleDateString('es-MX', { weekday:'short', day:'2-digit', month:'short', year:'numeric' });
        const hora  = r.entry_time ? r.entry_time.substring(0,5) : '—';
        const parcialNombre = r.parciales?.nombre || '—';
        return `<tr>
          <td>${fecha}</td>
          <td>${statusBadge(r.status)}</td>
          <td style="font-family:monospace;font-size:.8rem">${hora}</td>
          <td style="color:#6b7280;font-size:.75rem">${parcialNombre}</td>
        </tr>`;
      }).join('');
    }

    function applyFilters() {
      const parcialFilter = document.getElementById('filter-parcial').value;
      const statusFilter  = document.getElementById('filter-status').value;
      let filtered = allRecords;
      if (parcialFilter) filtered = filtered.filter(r => String(r.parcial_id) === parcialFilter);
      if (statusFilter)  filtered = filtered.filter(r => r.status === statusFilter);
      renderTable(filtered);
      updateKPIs(filtered.length > 0 ? filtered : allRecords, filtered.length < allRecords.length);
    }

    function updateKPIs(records, isFiltered) {
      const presentes = records.filter(r => r.status === 'A tiempo' || r.status === 'Retardo').length;
      const faltas    = records.filter(r => r.status === 'Falta').length;
      const total     = records.length;
      const pct       = total > 0 ? Math.round((presentes / total) * 100) : 0;
      document.getElementById('kpi-presentes').textContent = presentes;
      document.getElementById('kpi-faltas').textContent    = faltas;
      document.getElementById('kpi-pct').textContent       = pct + '%';
    }

    async function load() {
      allRecords = await getMisAsistencias(alumno.id);
      document.getElementById('loading').style.display = 'none';
      
      updateKPIs(allRecords, false);
      renderTable(allRecords);

      // Cargar parciales en el filtro si el sistema está activo
      const cfg = await getConfigPeriodos();
      if (cfg && cfg.activo) {
        const parciales = await getParciales();
        const sel = document.getElementById('filter-parcial');
        parciales.forEach(p => {
          const opt = document.createElement('option');
          opt.value = p.id;
          opt.textContent = p.nombre;
          sel.appendChild(opt);
        });
      }

      document.getElementById('filter-parcial').addEventListener('change', applyFilters);
      document.getElementById('filter-status').addEventListener('change', applyFilters);
    }

    load();
  </script>
</body>
</html>
